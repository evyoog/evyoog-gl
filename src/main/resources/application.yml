spring:
  application:
    name: evyoog-gl
  autoconfigure:
    # This app authenticates purely via JwtAuthenticationFilter (SecurityContextHolder is
    # set directly from the JWT, never through AuthenticationManager/UserDetailsService),
    # so the default in-memory user Boot generates here is unused — exclude it to silence
    # the "Using generated security password" boot-log noise. Boot 4 moved this class to
    # org.springframework.boot.security.autoconfigure (NOT the Boot 3
    # org.springframework.boot.autoconfigure.security.servlet path) — verified against
    # the actual spring-boot-security-4.0.7.jar contents before using it here.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://vyg-batch-1.cgtfswn9milw.ap-south-1.rds.amazonaws.com:5432/vygmicroservice}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:vygpost23}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: gl
        format_sql: true
  flyway:
    enabled: true
    schemas: gl,aie,auth
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 22
    baseline-description: gl29_audit_trail
    validate-on-migrate: true
    # This RDS instance (vygmicroservice) is shared with other services; pgcrypto was
    # installed by one of them into its own schema (ticket_sandbox) rather than public.
    # Flyway sets search_path to exactly `schemas` above during migration, so V23's
    # gen_salt()/crypt() calls can't resolve pgcrypto without this appended.
    init-sqls:
      - "SET search_path TO gl, aie, auth, ticket_sandbox, public"
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

evyoog:
  jwt:
    secret: ${EVYOOG_JWT_SECRET:evyoog-jwt-secret-key-minimum-256-bits-long-replace-in-production}
    expiration-ms: 3600000
    refresh-expiration-ms: 604800000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

server:
  port: 8080

logging:
  level:
    com.evyoog: INFO
    org.flywaydb: INFO

cors:
  allowed-origins: "https://probable-spork-wvr5w4xg9jp93xq5-5173.app.github.dev,https://finance-api.evyoog.com"
