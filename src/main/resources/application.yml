spring:
  application:
    name: evyoog-gl
  autoconfigure:
    # This app authenticates purely via JwtAuthenticationFilter (SecurityContextHolder is
    # set directly from the JWT, never through AuthenticationManager/UserDetailsService),
    # so the default in-memory user Boot generates here is unused — exclude it to silence
    # the "Using generated security password" boot-log noise. Boot 4 moved this class to
    # org.springframework.boot.security.autoconfigure (NOT the Boot 3
    # org.springframework.boot.autoconfigure.security.servlet path) — verified against
    # the actual spring-boot-security-4.0.7.jar contents before using it here.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://vyg-batch-1.cgtfswn9milw.ap-south-1.rds.amazonaws.com:5432/vygmicroservice}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:vygpost23}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: CREATE SCHEMA IF NOT EXISTS "vyg_gl"
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: vyg_gl
        format_sql: true
  flyway:
    enabled: true
    # 'public' added because pgcrypto (gen_salt/crypt, used in V23__auth01_security.sql)
    # is installed there, and Flyway's migration session search_path is built from
    # exactly this list — without 'public' here, gen_salt()/crypt() calls fail with
    # "function does not exist" even though the extension is present in the database.
    schemas: vyg_gl,aie,auth,public
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

evyoog:
  jwt:
    secret: ${EVYOOG_JWT_SECRET:evyoog-jwt-secret-key-minimum-256-bits-long-replace-in-production}
    expiration-ms: 3600000
    refresh-expiration-ms: 604800000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

server:
  port: 8080

logging:
  level:
    com.evyoog: INFO
    org.flywaydb: INFO